{{/* Single-track SoundCloud embed. The stock `soundcloud` shortcode is playlist-only; this one
     takes a track id so a page can pin one mix without wrapping it in a set. */}}
<div class="embed soundcloud-player">
    <iframe width="100%" height="166" scrolling="no" frameborder="no" allow="autoplay"
    src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/{{ index .Params 0 }}&color=%23c9622e&auto_play=false&hide_related=false&show_comments=true&show_user=true&show_reposts=false&show_teaser=true"></iframe>
</div>
