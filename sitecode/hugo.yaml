baseurl: 'https://mrcupp.com'
DefaultContentLanguage: en
title: IamMrCupp
theme: iammrcupp
pygmentsStyle: trac
pygmentsUseClasses: true
pygmentsCodeFences: true
pygmentsCodefencesGuessSyntax: true
enableEmoji: true
enableGitInfo: true

module:
  imports:
    - path: github.com/IamMrCupp/hugo-shortcodes
      mounts:
        - source: "layouts/shortcodes/"
          target: "layouts/shortcodes/"

Params:
  homeTitle: IamMrCupp
  subtitle: Personal Website for Aaron Cupp
  mainSections:
    - post
    - posts
  logo: img/iammrcupp-green-cyberpunk-game-style-800x800.png
  favicon: img/favicon.ico
  dateFormat: 'January 2, 2006'
  commit: 'https://github.com/IamMrCupp/mrcupp-project/tree/'
  rss: true
  comments: true
  readingTime: true
  wordCount: true
  useHLJS: true
  socialShare: true
  selfHosted: true
  delayDisqus: true
  showRelatedPosts: true
  copyright: 'CC BY-SA '
  disclaimerText: >-
    The opinions expressed herein are my own personal opinions and do not
    represent my employer’s view in any way.
  Author:
    name: Aaron Cupp
    email: mrcupp@mrcupp.com
    github: iammrcupp
    linkedin: mrcupp
    instagram: iammrcupp
    soundcloud: mrcupp

